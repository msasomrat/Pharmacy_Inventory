name: Feature request
description: Propose a new capability or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / business need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (Given / When / Then)
    validations:
      required: true
