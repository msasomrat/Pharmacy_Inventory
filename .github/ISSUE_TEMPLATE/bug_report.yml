name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Do not paste customer personal data, passwords or keys.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [POS / Sales, Inventory, Purchases, Customers, Loyalty, Transfers, Reports, Auth, Other]
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch and role (e.g. Mohammadpur / Salesman)
