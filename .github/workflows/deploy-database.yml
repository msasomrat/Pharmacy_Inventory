name: Deploy database

# Applies pending migrations in supabase/migrations to the production Supabase database.
# Manual only, guarded by the `production` GitHub Environment (add a required reviewer there).
# It connects straight to Postgres, so no Supabase account token is needed (least privilege).
#
# Secret (Settings -> Environments -> production -> Environment secrets):
#   SUPABASE_DB_URL  the "Session pooler" connection string from Supabase -> Connect,
#                    with [YOUR-PASSWORD] replaced by the database password, e.g.
#                    postgresql://postgres.<ref>:<password>@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
#                    (GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host does not work.)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = show pending migrations only; apply = apply them'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: deploy-database
  cancel-in-progress: false # never interrupt a migration

jobs:
  deploy:
    name: ${{ inputs.mode == 'apply' && 'Apply migrations' || 'Plan migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check secret is configured
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Missing secret SUPABASE_DB_URL in the production environment"; exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *YOUR-PASSWORD*) echo "::error::Replace [YOUR-PASSWORD] in SUPABASE_DB_URL with the real password"; exit 1 ;;
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL must start with postgresql://"; exit 1 ;;
          esac
          # Diagnose common copy/paste mistakes without ever printing the value.
          url="$SUPABASE_DB_URL"
          bad=0
          fail() { echo "::error::$1"; bad=1; }
          case "$url" in *[[:space:]]*) fail "SUPABASE_DB_URL contains a space or line break; paste it as one line" ;; esac
          case "$url" in *'['*|*']'*) fail "SUPABASE_DB_URL contains [ or ]; remove the square brackets around the password" ;; esac
          case "$url" in *'#'*) fail "Password contains # ; write it as %23" ;; esac
          case "$url" in *'?'*) fail "Password contains ? ; write it as %3F" ;; esac
          at_count=$(printf '%s' "$url" | tr -cd '@' | wc -c)
          [ "$at_count" -gt 1 ] && fail "Password contains @ ; write it as %40"
          if printf '%s' "$url" | grep -qE '%([^0-9A-Fa-f]|[0-9A-Fa-f][^0-9A-Fa-f]|[0-9A-Fa-f]?$)'; then
            fail "Password contains a % that is not followed by two hex digits; write a literal % as %25"
          fi
          case "$url" in *@*.pooler.supabase.com:5432/postgres) ;; *) fail "SUPABASE_DB_URL must end with @aws-0-<region>.pooler.supabase.com:5432/postgres (Session pooler)" ;; esac
          [ "$bad" -eq 0 ] || exit 1
          echo "SUPABASE_DB_URL looks well-formed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Pending migrations (dry run)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        if: inputs.mode == 'apply'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
      - name: Migration status
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
