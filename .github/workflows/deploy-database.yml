name: Deploy database

# Applies pending migrations in supabase/migrations to the production Supabase project.
# Manual only, guarded by the `production` GitHub Environment (add a required reviewer there).
# Secrets (Settings -> Environments -> production -> Environment secrets):
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   database password chosen when the project was created
#   SUPABASE_PROJECT_REF   project reference id (the xxxx in https://xxxx.supabase.co)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = show pending migrations only; apply = apply them'
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: deploy-database
  cancel-in-progress: false # never interrupt a migration

jobs:
  deploy:
    name: ${{ inputs.mode == 'apply' && 'Apply migrations' || 'Plan migrations' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets are configured
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name in the production environment"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        if: inputs.mode == 'apply'
        run: supabase db push
      - name: Migration status
        run: supabase migration list
