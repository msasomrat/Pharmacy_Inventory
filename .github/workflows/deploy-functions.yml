name: Deploy edge functions

# Deploys the Supabase Edge Functions in supabase/functions (currently: admin-users, which creates the
# sign-in account for staff the owner invited). Manual only, guarded by the `production` environment.
#
# Secrets (Settings -> Environments -> production -> Environment secrets):
#   SUPABASE_ACCESS_TOKEN  Supabase -> Account -> Access Tokens -> Generate new token (classic token).
#   SUPABASE_PROJECT_REF   the project id, e.g. jrbkcbgybushnjiwipyy (Project Settings -> General).
# The function itself reads SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY from the
# Supabase runtime; the service-role key never leaves Supabase.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy admin-users
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets are configured
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Missing secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          echo "$SUPABASE_PROJECT_REF" | grep -Eq '^[a-z]{20}$' \
            || { echo "::error::SUPABASE_PROJECT_REF must be the 20-letter project id"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      - name: Deploy
        # --use-api bundles on Supabase's side, so no Docker is needed on the runner.
        run: supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF" --use-api
